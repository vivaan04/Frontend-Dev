<!DOCTYPE html>
<html>
<head>
<title>YouTube Responsive Embed</title>
<style>
iframe {
  width: 80%;
  aspect-ratio: 16 / 9; /* keeps video responsive */
  border: none;
}
</style>
</head>
<body>
<h2>Responsive YouTube Video</h2>
<iframe 
  src="https://www.youtube.com/embed/tgbNymZ7vqY" 
  title="YouTube video" 
  allowfullscreen>
</iframe>
</body>
</html>
