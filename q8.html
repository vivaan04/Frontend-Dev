<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Layout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f2f4f7;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: #0055cc;
      color: white;
      text-align: center;
      padding: 1rem;
      font-size: 1.5rem;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }

    .container {
      display: flex;
      margin-top: 70px;
      height: calc(100vh - 70px);
    }

    aside {
      background-color: #1a1a1a;
      color: white;
      width: 220px;
      display: flex;
      flex-direction: column;
      padding: 1rem;
    }

    aside a {
      color: white;
      text-decoration: none;
      margin: 0.8rem 0;
      padding: 0.5rem;
      border-radius: 6px;
      transition: background-color 0.3s;
    }

    aside a:hover {
      background-color: #333;
    }

    main {
      flex: 1;
      padding: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: space-evenly;
      align-items: flex-start;
      background-color: #f9fafc;
      overflow-y: auto;
    }

    .box {
      background-color: white;
      width: 45%;
      min-width: 280px;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .box h3 {
      margin-bottom: 1rem;
      color: #0055cc;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      aside {
        width: 100%;
        flex-direction: row;
        justify-content: space-around;
      }

      main {
        flex-direction: column;
        align-items: center;
      }

      .box {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <header>My Dashboard</header>

  <div class="container">
    <aside>
      <a href="#">Overview</a>
      <a href="#">Reports</a>
      <a href="#">Analytics</a>
      <a href="#">Settings</a>
    </aside>

    <main>
      <div class="box">
        <h3>Statistics</h3>
        <p>Overview of your latest performance data.</p>
      </div>

      <div class="box">
        <h3>Recent Activity</h3>
        <p>Track your most recent actions and updates.</p>
      </div>
    </main>
  </div>
</body>
</html>
