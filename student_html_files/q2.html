<!DOCTYPE html>
<!-- q2.html - Hyperlink to Google that opens in a new tab -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Link to Google</title>
</head>
<body>
  <h1>Your Full Name</h1>
  <!-- Anchor tag with target="_blank" to open link in a new tab -->
  <p>Search the web on <a href="https://www.google.com" target="_blank" rel="noopener">Google Search</a>.</p>
</body>
</html>
