<!DOCTYPE html>
<!-- q6.html - Quote using blockquote and cite -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Meaningful Quote</title>
</head>
<body>
  <h1>Your Full Name</h1>
  <blockquote>
    The only way to do great work is to love what you do.
    <br>
    <cite>- Steve Jobs</cite>
  </blockquote>
</body>
</html>
