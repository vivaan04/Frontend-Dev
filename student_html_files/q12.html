<!DOCTYPE html>
<!-- q12.html - Creative paragraph combining inline elements -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Inline Formatting Demo</title>
</head>
<body>
  <h1>Your Full Name</h1>
  <p>
    I am <strong>passionate</strong> about learning web development,<br>
    and I find <em>practice</em> to be the most important part of improvement.
    <mark>Keep coding every day</mark> <small>(Updated recently)</small>.
  </p>
</body>
</html>
