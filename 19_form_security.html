<!DOCTYPE html>
<html>
<head><title>Form Security</title></head>
<body>
<h2>Secure Form</h2>
<form autocomplete="off">
  Username: <input type="text" required><br><br>
  Password: <input type="password" required><br><br>
  <input type="submit" value="Login">
</form>
<p>Note: Turning off autocomplete prevents browsers from saving sensitive data like passwords, improving security.</p>
</body>
</html>
