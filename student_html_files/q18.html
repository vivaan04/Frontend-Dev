<!DOCTYPE html>
<!-- q18.html - Aside with Useful Links -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Aside: Useful Links</title>
</head>
<body>
  <header>
    <h1>My Simple Website</h1>
  </header>

  <aside>
    <h2>Useful Links</h2>
    <ul>
      <li><a href="https://www.example.com" target="_blank" rel="noopener">Example Site</a></li>
      <li><a href="https://www.wikipedia.org" target="_blank" rel="noopener">Wikipedia</a></li>
    </ul>
  </aside>
</body>
</html>
