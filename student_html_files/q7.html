<!DOCTYPE html>
<!-- q7.html - Demonstrate heading levels h1, h2, h3 -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Heading Levels Example</title>
</head>
<body>
  <!-- h1 for name -->
  <h1>Your Full Name</h1>

  <!-- h2 for role -->
  <h2>Student</h2>

  <!-- h3 for hobbies/interests -->
  <h3>Hobbies: Coding, Reading, Travelling</h3>
</body>
</html>
