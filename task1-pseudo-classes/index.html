<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task1 - Pseudo-Classes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header><h1>Pseudo-Classes Demo</h1></header>
<main class="row">
  <section class="card">
    <a href="#" class="link">Hover this link</a>
    <p><code>:hover</code> — changes on mouseover</p>
  </section>
  <section class="card">
    <input type="text" placeholder="Focus me" />
    <p><code>:focus</code> — active input</p>
  </section>
  <section class="card">
    <button class="btn">Press me</button>
    <p><code>:active</code> — while pressing</p>
  </section>
  <section class="card">
    <ul class="items">
      <li>One</li>
      <li>Two</li>
      <li>Three</li>
      <li>Four</li>
    </ul>
    <p><code>:nth-child()</code> — styles 2nd item</p>
  </section>
</main>

</body>
</html>
