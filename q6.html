<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 2%;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .photo {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .photo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.3s ease;
      border-radius: 10px;
    }

    .photo:hover img {
      transform: scale(1.1);
    }

    .caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      text-align: center;
      padding: 1rem;
      opacity: 0;
      transition: opacity 0.3s ease;
      font-size: 1.1rem;
      border-radius: 0 0 10px 10px;
    }

    .photo:hover .caption {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      }
    }
  </style>
</head>
<body>
  <h1>My Photo Gallery</h1>
  <div class="gallery">
    <div class="photo">
      <img src="https://picsum.photos/id/1011/400/300" alt="Mountain">
      <div class="caption">Mountain</div>
    </div>
    <div class="photo">
      <img src="https://picsum.photos/id/1015/400/300" alt="Forest">
      <div class="caption">Forest</div>
    </div>
    <div class="photo">
      <img src="https://picsum.photos/id/1025/400/300" alt="Beach">
      <div class="caption">Beach</div>
    </div>
    <div class="photo">
      <img src="https://picsum.photos/id/1035/400/300" alt="Desert">
      <div class="caption">Desert</div>
    </div>
    <div class="photo">
      <img src="https://picsum.photos/id/1041/400/300" alt="City">
      <div class="caption">City</div>
    </div>
    <div class="photo">
      <img src="https://picsum.photos/id/1050/400/300" alt="Waterfall">
      <div class="caption">Waterfall</div>
    </div>
  </div>
</body>
</html>
