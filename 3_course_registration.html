<!DOCTYPE html>
<html>
<head><title>Course Registration Form</title></head>
<body>
<h1>Course Registration</h1>
<form>
<fieldset>
<legend>Student Information</legend>
<label>Name: <input type="text" name="name"></label><br>
<label>Email: <input type="email" name="email"></label><br>
<label>Course:
<select>
<option selected>Select Course</option>
<option>Web Development</option>
<option>Data Science</option>
<option>Machine Learning</option>
</select></label>
</fieldset>
</form>
<h2>Course Schedules</h2>
<table border="1">
<tr><th>Day</th><th>Time</th><th>Instructor</th></tr>
<tr><td>Monday</td><td>10 AM</td><td>Mr. Smith</td></tr>
<tr><td>Wednesday</td><td>2 PM</td><td>Ms. Jane</td></tr>
</table>
</body></html>
